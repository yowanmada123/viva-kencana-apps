workflows:
  ios-release-workflow:
    name: Viva Kencana iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: default
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build iOS IPA
        script: |
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - user@example.com # Ganti dengan email Anda untuk menerima notifikasi dan link unduhan
        notify:
          success: true
          failure: true